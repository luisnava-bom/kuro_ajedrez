<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>El Desafío de Kuro - Ajedrez Pro</title>
    <link rel="icon" type="image/png" href="kuro.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { display: flex; justify-content: space-between; padding: 10px 20px; background-color: #1e1e1e; border-bottom: 2px solid #333; }
        header h1 { margin: 0; font-size: 24px; color: #f44336; }
        .btn-ajustes { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        
        #menu-principal { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; text-align: center; }
        #menu-principal h2 { color: #ff9800; margin-bottom: 30px;}
        .niveles { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .btn-nivel { padding: 15px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: white; background-color: #2a2a2a; border: 2px solid transparent; width: 150px; display: flex; flex-direction: column; align-items: center; gap: 5px;}
        .btn-nivel span { font-size: 12px; font-weight: normal; opacity: 0.8;}
        .avatar { width: 100px; height: 100px; object-fit: cover; object-position: top; border-radius: 50%; border: 3px solid #555; margin-bottom: 10px; background-color: #000; }
        #btn-yami:hover { border-color: #4CAF50; box-shadow: 0 0 15px #4CAF50; }
        #btn-hikaru:hover { border-color: #FFC107; box-shadow: 0 0 15px #FFC107; }
        #btn-kuro:hover { border-color: #f44336; box-shadow: 0 0 15px #f44336; }
        #btn-humano:hover { border-color: #2196F3; box-shadow: 0 0 15px #2196F3; }

        #contenedor-juego { display: none; flex-grow: 1; padding: 20px; gap: 20px; justify-content: center; }
        .panel-lateral { width: 200px; background-color: #1e1e1e; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        .foto-rival { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #f44336; object-fit: cover; object-position: top; margin-bottom: 10px;}
        .nombre-rival { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 5px;}
        .dificultad-rival { font-size: 14px; color: #ff9800; font-weight: bold; margin-bottom: 15px;}
        .capturas { width: 100%; font-size: 30px; text-align: center; min-height: 40px; word-wrap: break-word;}
        
        .panel-central { display: flex; flex-direction: column; align-items: center; }
        .tablero-wrapper { display: grid; grid-template-columns: 20px 520px; grid-template-rows: 520px 20px; gap: 5px; }
        #tablero { display: grid; grid-template-columns: repeat(8, 65px); grid-template-rows: repeat(8, 65px); border: 4px solid #333; border-radius: 5px; }
        .casilla { display: flex; align-items: center; justify-content: center; font-size: 50px; cursor: pointer; user-select: none; }
        .blanca { background-color: #eeddcc; color: #111; }
        .negra { background-color: #2e5d3e; color: #111; }
        .pieza-negra { color: #000 !important; text-shadow: 1px 1px 2px rgba(255,255,255,0.3); }
        .pieza-blanca { color: #fff !important; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .seleccionada { background-color: #d4af37 !important; box-shadow: inset 0 0 15px #fff; }
        
        .coord-fila { display: grid; grid-template-rows: repeat(8, 65px); align-items: center; justify-content: center; font-size: 14px; color: #888; }
        .coord-col { display: grid; grid-template-columns: repeat(8, 65px); align-items: center; justify-items: center; font-size: 14px; color: #888; }
        
        #mensaje-kuro { margin-top: 10px; font-size: 20px; color: #ff9800; font-weight: bold; height: 30px; text-align: center;}
        .controles { margin-top: 15px; display: flex; gap: 15px; }
        button { padding: 10px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white; }
        #btn-reiniciar { background-color: #4CAF50; }
        #btn-ayuda { background-color: #2196F3; }
        #btn-menu { background-color: #555; }
        
        .panel-historial { width: 200px; background-color: #1e1e1e; border-radius: 10px; padding: 15px; border: 1px solid #333; overflow-y: auto; max-height: 550px; }
        .panel-historial h3 { margin-top: 0; text-align: center; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px;}
        .lista-movimientos { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 5px; font-size: 14px;}
        .mov-num { color: #888; }
        .mov-blanco { color: #fff; font-weight: bold;}
        .mov-negro { color: #f44336; font-weight: bold;}
        
        .animacion-mover { animation: moverPieza 0.4s ease-in-out; }
        @keyframes moverPieza { 0% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
        
        #modal-ajustes { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <audio id="musica-fondo" loop>
        <source src="musica_kuro.mp3" type="audio/mpeg">
    </audio>

    <header>
        <h1>El Desafío de Kuro</h1>
        <button class="btn-ajustes" onclick="abrirAjustes()" title="Ajustes">⚙️</button>
    </header>
    
    <div id="modal-ajustes">
        <div style="background-color: #1e1e1e; padding: 30px; border-radius: 10px; width: 300px; border: 2px solid #f44336; text-align: center;">
            <h2 style="color: #ff9800; margin-top: 0;">⚙️ Ajustes</h2>
            <label style="display: block; margin-bottom: 10px;">Volumen Música:</label>
            <input type="range" id="vol-musica" min="0" max="1" step="0.1" value="0.3" style="width: 100%; margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 10px;">Volumen Voces:</label>
            <input type="range" id="vol-voces" min="0" max="1" step="0.1" value="1" style="width: 100%; margin-bottom: 20px;">
            <div style="border-top: 1px solid #333; padding-top: 15px; margin-bottom: 20px;">
                <p style="margin: 0; font-size: 14px; color: #aaa;">Creado por:</p>
                <p style="margin: 5px 0; font-size: 18px; font-weight: bold; color: #fff;">Luis Nava</p>
                <p style="margin: 0; font-size: 12px; color: #888;">Proyecto Kuro Academy</p>
            </div>
            <button onclick="cerrarAjustes()" style="background-color: #f44336; width: 100%;">Cerrar</button>
        </div>
    </div>

    <div id="menu-principal">
        <h2>Selecciona a tu oponente</h2>
        <div class="niveles">
            <button id="btn-yami" class="btn-nivel" onclick="iniciarJuego('yami')">
                <img src="yami.png" alt="Yami" class="avatar" onerror="this.style.display='none'">
                Yami <span>Nivel Fácil</span>
            </button>
            <button id="btn-hikaru" class="btn-nivel" onclick="iniciarJuego('hikaru')">
                <img src="hikaru.png" alt="Hikaru" class="avatar" onerror="this.style.display='none'">
                Hikaru <span>Nivel Medio</span>
            </button>
            <button id="btn-kuro" class="btn-nivel" onclick="iniciarJuego('kuro')">
                <img src="kuro.png" alt="Kuro" class="avatar" onerror="this.style.display='none'">
                Kuro <span>Nivel Imposible</span>
            </button>
            <button id="btn-humano" class="btn-nivel" onclick="iniciarJuego('humano')">
                <div class="avatar" style="display:flex; align-items:center; justify-content:center; font-size:40px;">👥</div>
                Humano <span>2 Jugadores</span>
            </button>
        </div>
    </div>

    <div id="contenedor-juego">
        <div class="panel-lateral">
            <img id="foto-rival-panel" src="kuro.png" class="foto-rival" onerror="this.style.display='none'">
            <div id="nombre-rival-panel" class="nombre-rival">Kuro</div>
            <div id="nivel-rival-panel" class="dificultad-rival">Nivel Imposible</div>
            <div style="font-size:12px; color:#888; margin-top: 10px;">Tus capturas:</div>
            <div id="capturas-jugador" class="capturas" style="color: #fff;"></div>
            <div style="font-size:12px; color:#888; margin-top: 10px;">Capturas del rival:</div>
            <div id="capturas-rival" class="capturas" style="color: #f44336;"></div>
        </div>

        <div class="panel-central">
            <div id="mensaje-kuro">Kuro: "Haz tu movimiento."</div>
            <div class="tablero-wrapper">
                <div class="coord-fila" id="coords-filas"></div>
                <div id="tablero"></div>
                <div></div>
                <div class="coord-col" id="coords-cols"></div>
            </div>
            <div class="controles">
                <button id="btn-reiniciar" onclick="reiniciarJuego()">Reiniciar Partida</button>
                <button id="btn-ayuda" onclick="pedirAyuda()">Ayuda (2)</button>
                <button id="btn-menu" onclick="volverAlMenu()">Volver al Menú</button>
            </div>
        </div>

        <div class="panel-historial">
            <h3>Historial de Jugadas</h3>
            <div id="lista-movimientos" class="lista-movimientos"></div>
        </div><script>
        const kuroMotor = new Worker('stockfish.js');
        kuroMotor.postMessage('uci');
        
        const juego = new Chess(); 
        const tableroHTML = document.getElementById('tablero');
        const mensaje = document.getElementById('mensaje-kuro');
        const musica = document.getElementById('musica-fondo');
        const listaMovimientos = document.getElementById('lista-movimientos');
        
        let piezaSeleccionada = null;
        let ayudasRestantes = 2;
        let nivelActual = 'kuro'; 
        let piezasCapturadas = { blancas: [], negras: [] };
        window.volumenVoces = 1; 

        const personajes = {
            'yami': { nombre: "Yami", dificultad: "Nivel Fácil", profundidad: 1, foto: "yami.png", frases: ["Jaja, ¿eso es todo?", "Te voy a destruir.", "¡Qué aburrido!"] },
            'hikaru': { nombre: "Hikaru", dificultad: "Nivel Medio", profundidad: 5, foto: "hikaru.png", frases: ["Perfecto, como siempre.", "Un movimiento interesante.", "La belleza siempre gana."] },
            'kuro': { nombre: "Kuro", dificultad: "Nivel Imposible", profundidad: 12, foto: "kuro.png", frases: ["Predecible.", "Tu turno.", "No hay esperanza.", "Como lo calculé."] },
            'humano': { nombre: "Jugador 2", dificultad: "Local", profundidad: 0, foto: "", frases: ["Tu turno.", "Buena jugada."] }
        };

        function abrirAjustes() { document.getElementById('modal-ajustes').style.display = 'flex'; }
        function cerrarAjustes() { document.getElementById('modal-ajustes').style.display = 'none'; }
        
        document.getElementById('vol-musica').addEventListener('input', (e) => { musica.volume = e.target.value; });
        document.getElementById('vol-voces').addEventListener('input', (e) => { window.volumenVoces = parseFloat(e.target.value); });

        function iniciarJuego(nivel) {
            nivelActual = nivel;
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('contenedor-juego').style.display = 'flex';
            
            const datosRival = personajes[nivel];
            document.getElementById('nombre-rival-panel').innerText = nivel === 'humano' ? "Jugador 2" : datosRival.nombre;
            document.getElementById('nivel-rival-panel').innerText = datosRival.dificultad;
            
            const fotoPanel = document.getElementById('foto-rival-panel');
            if (nivel === 'humano') { fotoPanel.style.display = 'none'; } 
            else { fotoPanel.style.display = 'block'; fotoPanel.src = datosRival.foto; }

            musica.volume = parseFloat(document.getElementById('vol-musica').value);
            musica.play().catch(e => console.log("Música bloqueada"));
            
            if(nivel !== 'humano') kuroHabla(`Soy ${datosRival.nombre}. Veamos qué tienes.`);
            else mensaje.innerText = "Turno de las Blancas (Jugador 1).";
            
            reiniciarJuego();
        }

        function volverAlMenu() {
            document.getElementById('contenedor-juego').style.display = 'none';
            document.getElementById('menu-principal').style.display = 'flex';
            juego.reset();
            piezaSeleccionada = null;
        }

        function crearCoordenadas() {
            const filas = document.getElementById('coords-filas');
            const cols = document.getElementById('coords-cols');
            for(let i=8; i>=1; i--) filas.innerHTML += `<div>${i}</div>`;
            ['A','B','C','D','E','F','G','H'].forEach(l => cols.innerHTML += `<div>${l}</div>`);
        }

        function kuroHabla(texto) {
            if (nivelActual === 'humano') return;
            mensaje.innerText = `${personajes[nivelActual].nombre}: '${texto}'`;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const voz = new SpeechSynthesisUtterance(texto);
                voz.lang = 'es-ES'; 
                voz.pitch = nivelActual === 'yami' ? 1.2 : (nivelActual === 'hikaru' ? 1.1 : 0.8); 
                voz.volume = window.volumenVoces; 
                window.speechSynthesis.speak(voz);
            }
        }

        function reproducirSonido(tipo) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                oscillator.connect(audioCtx.destination);
                oscillator.frequency.setValueAtTime(tipo === 'mover' ? 400 : 200, audioCtx.currentTime);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.1);
            } catch(e) { }
        }

        const piezasEmoji = { 'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔' };

        function dibujarTablero(coordMovida = null) {
            tableroHTML.innerHTML = '';
            const tableroActual = juego.board(); 
            for (let fila = 0; fila < 8; fila++) {
                for (let col = 0; col < 8; col++) {
                    const casilla = document.createElement('div');
                    casilla.classList.add('casilla');
                    casilla.classList.add((fila + col) % 2 === 0 ? 'blanca' : 'negra');
                    
                    const pieza = tableroActual[fila][col];
                    if (pieza) {
                        let tipo = pieza.color === 'w' ? pieza.type.toUpperCase() : pieza.type;
                        casilla.innerText = piezasEmoji[tipo];
                        casilla.classList.add(pieza.color === 'w' ? 'pieza-blanca' : 'pieza-negra');
                    }
                    
                    const letras = ['a','b','c','d','e','f','g','h'];
                    const coordActual = letras[col] + (8 - fila);
                    if (coordMovida === coordActual) casilla.classList.add('animacion-mover');
                    
                    casilla.dataset.fila = fila;
                    casilla.dataset.col = col;
                    casilla.addEventListener('click', clickCasilla);
                    tableroHTML.appendChild(casilla);
                }
            }
        }

        function actualizarHistorialYCapturas(movimiento) {
            const capturasJugadorDiv = document.getElementById('capturas-jugador');
            const capturasRivalDiv = document.getElementById('capturas-rival');

            if (movimiento.captured) {
                if (movimiento.color === 'w') {
                    let pieza = piezasEmoji[movimiento.captured]; 
                    piezasCapturadas.blancas.push(pieza);
                    capturasJugadorDiv.innerHTML = piezasCapturadas.blancas.join('');
                } else {
                    let pieza = piezasEmoji[movimiento.captured.toUpperCase()]; 
                    piezasCapturadas.negras.push(pieza);
                    capturasRivalDiv.innerHTML = piezasCapturadas.negras.join('');
                }
            }

            const historial = juego.history();
            listaMovimientos.innerHTML = '';
            for (let i = 0; i < historial.length; i += 2) {
                const numJugada = (i / 2) + 1;
                const movBlanco = historial[i];
                const movNegro = historial[i + 1] || '';
                listaMovimientos.innerHTML += `
                    <div class="mov-num">${numJugada}.</div>
                    <div class="mov-blanco">${movBlanco}</div>
                    <div class="mov-negro">${movNegro}</div>
                `;
            }
            listaMovimientos.scrollTop = listaMovimientos.scrollHeight;
        }

        function clickCasilla(e) {
            if (nivelActual !== 'humano' && juego.turn() !== 'w') return;
            const fila = parseInt(e.target.dataset.fila);
            const col = parseInt(e.target.dataset.col);
            const letras = ['a','b','c','d','e','f','g','h'];
            const coord = letras[col] + (8 - fila);
            const piezaEnCasilla = juego.get(coord);
            const colorTurno = juego.turn();

            if (!piezaSeleccionada) {
                if (piezaEnCasilla && piezaEnCasilla.color === colorTurno) {
                    piezaSeleccionada = coord;
                    e.target.classList.add('seleccionada');
                }
                return;
            }

            if (piezaSeleccionada) {
                const movimiento = juego.move({ from: piezaSeleccionada, to: coord, promotion: 'q' });
                if (movimiento !== null) {
                    reproducirSonido(movimiento.captured ? 'comer' : 'mover');
                    piezaSeleccionada = null;
                    dibujarTablero(coord);
                    actualizarHistorialYCapturas(movimiento);
                    
                    if (juego.game_over()) {
                        if (juego.in_checkmate()) alert(`¡Jaque Mate! Ganaron las ${juego.turn() === 'w' ? 'Negras' : 'Blancas'}`);
                        else alert("¡Tablas (Empate)!");
                        return;
                    }
                    
                    if (nivelActual === 'humano') {
                        mensaje.innerText = juego.turn() === 'w' ? "Turno de las Blancas." : "Turno de las Negras.";
                    } else {
                        mensaje.innerText = `${personajes[nivelActual].nombre} está pensando...`;
                        kuroMotor.postMessage('position fen ' + juego.fen());
                        kuroMotor.postMessage('go depth ' + personajes[nivelActual].profundidad);
                    }
                } else {
                    piezaSeleccionada = null;
                    dibujarTablero();
                }
            }
        }

        kuroMotor.onmessage = function(event) {
            const linea = event.data;
            if (linea.startsWith('bestmove') && nivelActual !== 'humano') {
                const movimiento = linea.split(' ')[1];
                if (movimiento === '(none)') return;
                
                const from = movimiento.substring(0, 2);
                const to = movimiento.substring(2, 4);
                
                setTimeout(() => {
                    const movKuro = juego.move({ from: from, to: to, promotion: 'q' });
                    if (movKuro) {
                        reproducirSonido(movKuro.captured ? 'comer' : 'mover');
                        dibujarTablero(to);
                        actualizarHistorialYCapturas(movKuro);
                        if (juego.game_over()) {
                            kuroHabla("Jaque mate.");
                            return;
                        }
                        const frases = personajes[nivelActual].frases;
                        kuroHabla(frases[Math.floor(Math.random() * frases.length)]);
                    }
                }, 800);
            }
        };

        function reiniciarJuego() {
            juego.reset();
            piezaSeleccionada = null;
            ayudasRestantes = 2;
            piezasCapturadas = { blancas: [], negras: [] };
            document.getElementById('capturas-jugador').innerHTML = '';
            document.getElementById('capturas-rival').innerHTML = '';
            listaMovimientos.innerHTML = '';
            document.getElementById('btn-ayuda').innerText = "Ayuda (2)";
            dibujarTablero();
            if (nivelActual !== 'humano') kuroHabla("¿Otra vez?");
            else mensaje.innerText = "Turno de las Blancas (Jugador 1).";
        }

        function pedirAyuda() {
            if (juego.turn() !== 'w' || ayudasRestantes === 0) return;
            ayudasRestantes--;
            document.getElementById('btn-ayuda').innerText = `Ayuda (${ayudasRestantes})`;
            
            kuroMotor.postMessage('position fen ' + juego.fen());
            kuroMotor.postMessage('go depth 10');
            mensaje.innerText = "Calculando la mejor jugada...";
            
            kuroMotor.onmessage = function(event) {
                const linea = event.data;
                if (linea.startsWith('bestmove')) {
                    const movimiento = linea.split(' ')[1];
                    if (movimiento !== '(none)') {
                        if(nivelActual !== 'humano') kuroHabla(`Mueve de ${movimiento.substring(0, 2)} a ${movimiento.substring(2, 4)}.`);
                        else mensaje.innerText = `Pista: Mueve de ${movimiento.substring(0, 2)} a ${movimiento.substring(2, 4)}.`;
                    }
                    kuroMotor.onmessage = juegoNormal;
                }
            };
        }

        function juegoNormal(event) {
            const linea = event.data;
            if (linea.startsWith('bestmove') && nivelActual !== 'humano') {
                const movimiento = linea.split(' ')[1];
                if (movimiento === '(none)') return;
                const from = movimiento.substring(0, 2);
                const to = movimiento.substring(2, 4);
                
                setTimeout(() => {
                    const movKuro = juego.move({ from: from, to: to, promotion: 'q' });
                    if (movKuro) {
                        reproducirSonido(movKuro.captured ? 'comer' : 'mover');
                        dibujarTablero(to);
                        actualizarHistorialYCapturas(movKuro);
                        if (juego.game_over()) {
                            kuroHabla("Jaque mate.");
                            return;
                        }
                        const frases = personajes[nivelActual].frases;
                        kuroHabla(frases[Math.floor(Math.random() * frases.length)]);
                    }
                }, 800);
            }
        }

        kuroMotor.onmessage = juegoNormal;
        crearCoordenadas();
    </script>
</body>
</html>
    </div>
